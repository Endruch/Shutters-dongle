[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    knolleary/PubSubClient@^2.8
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
extra_scripts = post:tools/merge_full_bin.py

[env:esp32-ota]
extends = env:esp32
upload_protocol = espota
upload_port = ${sysenv.DONGLE_HOST}
upload_flags = --auth=${sysenv.DONGLE_PASSWORD}
